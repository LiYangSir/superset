<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:transparent;overflow:hidden">
<script>
document.addEventListener('keydown', function(e) {
  e.preventDefault();
  window.__TAURI_INTERNALS__.invoke('native_terminal_key', {
    key: e.key,
    code: e.code,
    ctrl: e.ctrlKey,
    alt: e.altKey,
    shift: e.shiftKey,
    meta: e.metaKey
  });
});

var resizeTimer = null;
function reportResize() {
  var w = Math.round(window.innerWidth * devicePixelRatio);
  var h = Math.round(window.innerHeight * devicePixelRatio);
  window.__TAURI_INTERNALS__.invoke('native_terminal_resize', {
    width: w,
    height: h
  });
}

window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(reportResize, 50);
});

setTimeout(reportResize, 100);
</script>
</body>
</html>
